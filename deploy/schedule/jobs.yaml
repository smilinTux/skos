# skos scheduler - desired state (scheduler-as-code).
#
# This file is the single source of truth for the skos gtd-ingest / observability
# pipeline that runs on the primary node (noroc2027 / .158). It is rendered into
# the user crontab by `skos schedule install`; nothing here is applied by importing
# the repo. See docs/runbooks/skos-scheduler.md for the deploy/rollback flow.
#
# WHY CRONTAB (not systemd user timers):
#   The live pipeline already runs as a user crontab, and this whole subsystem is
#   the reference implementation of OBSERVABILITY_AND_SCHEDULING_STANDARD where every
#   job is wrapped in sk-cron-run (run-ledger + failure->GTD + sk-alert).
#   Rendering one ordered crontab block keeps the tight 04:45->07:45 daily sequence
#   legible in one place and lets `skos schedule install` reproduce the live schedule
#   byte-for-byte (clean diff / exact cutover) instead of 24 systemd unit files.
#   deploy/systemd/ still ships the skos-backup timer for the one job that benefits
#   from OnCalendar catch-up; the pipeline jobs stay on cron.
#
# PORTABILITY: every path is written with $HOME so the file is machine-independent.
#   `skos schedule install` expands them for the host it runs on. No machine-specific
#   absolute path (/home/<user>/...) is committed here. The runner was the last thing
#   tying the rendered crontab to a checkout location ($SKOS_REPO); it is now an
#   installed command, so relocating or worktree-ing the skos checkout no longer
#   breaks all 13 jobs. None of the job commands referenced $SKOS_REPO.
#
# SECRETS: no secret value is committed. `secret_env` lists env var NAMES that are
#   required at runtime. Crontab contains only SKOS_SCHEDULE_ENV=<protected-path>;
#   values are loaded by sk-cron-run and are never read by the installer.
version: 1

defaults:
  # The sk-cron-run wrapper, which ships with skcapstone as an installed
  # command (pyproject script-files, beside sk-alert). Every job runs as:
  # <runner> <job-name> <command>. scripts/sk-cron-run.sh in this repo is a
  # compatibility shim for anything that still names that path.
  runner: "$HOME/.skenv/bin/sk-cron-run"
  # PATH prepended to each line so cron finds the skenv console scripts + brew tools.
  path: "$HOME/.skenv/bin:$HOME/.local/bin:/home/linuxbrew/.linuxbrew/bin:/usr/bin:/bin"
  # Env var NAMES (not values) to prepend to each line. Values come from the env file.
  secret_env:
    - GOG_KEYRING_PASSWORD
    # A PATH to a restic env file, not a credential. Declared here rather than
    # as a per-job env in the manifest: sk-cron-run sources the protected file
    # for every job, so this reaches skmem-pg-backup with no schema change and
    # no value in the crontab. Same channel GTD_MAIL_ACCOUNTS already uses.
    - SKMEM_BACKUP_OFFBOX
    # Same shape for the flat memory backup: the PATH to the restic env file it
    # ships its off-site snapshot with (skmemory docs/BACKUP_SOP.md).
    - MEMORY_BACKUP_RESTIC_ENV

jobs:
  - name: youtube-ingest
    schedule: "30 5 * * *"
    command: "$HOME/clawd/scripts/youtube-ingest/daily_run.sh"
    log: "$HOME/clawd/logs/youtube-ingest-cron.log"

  - name: wiki-maintain
    schedule: "45 4 * * *"
    command: "$HOME/.skenv/bin/python3 $HOME/clawd/wiki/tools/wiki_maintain.py fill --top 15"
    log: "$HOME/.skcapstone/logs/wiki-maintain.log"

  - name: gtd-noise-sweep
    schedule: "0 6 * * *"
    command: "$HOME/clawd/skos/scripts/gtd-triage.sh"
    log: "$HOME/.skcapstone/logs/gtd-triage.cron.log"

  - name: corpus-check
    schedule: "5 6 * * *"
    command: "$HOME/.skenv/bin/sk-status corpus-check"
    log: "$HOME/.skcapstone/logs/sk-status.log"

  - name: email-triage
    schedule: "10 6 * * *"
    command: "$HOME/.skenv/bin/gtd-mail triage"
    log: "$HOME/.skcapstone/logs/gtd-mail.log"

  - name: ingest-calendar
    schedule: "15 6 * * *"
    command: "$HOME/.skenv/bin/skos ingest calendar"
    log: "$HOME/.skcapstone/logs/sk-ingest.log"

  - name: ingest-telegram
    schedule: "16 6 * * *"
    command: "$HOME/.skenv/bin/skos ingest telegram"
    log: "$HOME/.skcapstone/logs/sk-ingest.log"

  - name: ingest-email
    schedule: "35 6 * * *"
    command: "$HOME/.skenv/bin/skos ingest email"
    log: "$HOME/.skcapstone/logs/sk-ingest.log"

  - name: email-brief
    schedule: "45 6 * * *"
    command: "$HOME/.skenv/bin/gtd-mail digest"
    log: "$HOME/.skcapstone/logs/gtd-mail.log"

  - name: ops-report
    schedule: "45 7 * * *"
    # WD-4: this slot is absorbed by `skos watchdog digest` (card 2405db76). The
    # watchdog collects every registered source, publishes latest/, and sends the
    # ONE morning Hermes DM. sk-status stays installed as the digest's own counts
    # engine (adapters call it in-process); it is not removed, only no longer the
    # thing that DMs Chef directly. Rollback is this one line, back to:
    #   command: "$HOME/.skenv/bin/sk-status report"
    # See docs/runbooks/skwatchdog-schedule-cutover.md.
    command: "$HOME/.skenv/bin/skos watchdog digest"
    log: "$HOME/.skcapstone/logs/sk-status.log"

  - name: drchiro-ingest
    schedule: "*/30 * * * *"
    command: "/usr/bin/python3 $HOME/clawd/scripts/drchiro-mail-ingest.py"
    log: "$HOME/.skcapstone/logs/drchiro-ingest.log"

  - name: ingest-order
    schedule: "22 */3 * * *"
    command: "$HOME/.skenv/bin/skos ingest order"
    log: "$HOME/.skcapstone/logs/sk-ingest.log"

  - name: service-unit-audit
    # SERVICE_UNIT_STANDARD regression gate (prb-bd79dd5f). Fails if any node has
    # a unit whose start limiter can never engage: such a unit retries forever on
    # a permanent fault and can hang the host (.100, 13h, twice).
    schedule: "40 6 * * *"
    command: "$HOME/clawd/scripts/fleet-service-unit-audit.sh"
    log: "$HOME/.skcapstone/logs/service-unit-audit.log"

  # ───────────────────────────────────────────────────────────────────────────
  # Jobs that were live but undeclared until 2026-11-06.
  #
  # All eight ran under sk-cron-run from hand-written crontab lines OUTSIDE the
  # managed block, so `skos schedule diff` reported `extra: 8` and exited 1 on
  # every run. A drift gate that is permanently red cannot report drift: the one
  # signal that would show a job going missing was already saturated. Declaring
  # them is what makes the gate mean something again.
  #
  # Each entry reproduces the live schedule and command verbatim. Three of them
  # (yt-priority, yt-transcripts-backup, yt-transcripts-skhub-sync) had NO log
  # redirect at all, so their output went only to cron's mail; they now get a log
  # file, which is additive. PATH is deliberately left to the shared default:
  # the live lines carried four different PATHs, and the only one that differed
  # materially was skmem-pg-backup's /usr/local/bin, which was checked and holds
  # nothing it uses (restic, docker and pg_dump are all in /usr/bin).
  # skmem-pg-backup's SKMEM_BACKUP_OFFBOX is declared in secret_env above, so it
  # arrives through the protected env file rather than as a crontab value.
  # ───────────────────────────────────────────────────────────────────────────

  - name: skmem-pg-backup
    # skmem-pg dump, part of the skmem-pg group added 2026-07-06. 2026-10-20: now
    # ships OFF-SITE via restic to B2 (encrypted, dedup), and runs under
    # sk-cron-run so a failure fires sk-alert + a GTD item. Before that the dump
    # stayed on the box it protects and the script's own nightly warning reached
    # nobody, because this was the one backup job not wrapped.
    # 2026-11-11 (Chef): skmem-pg is derived and would be recreated from the
    # flat files, not restored, so it keeps ONE local dump replaced nightly
    # and nothing off-site (SKMEM_BACKUP_OFFBOX=none in the env file). The flat
    # source is what goes off-site, from memory-backup below. skmemory
    # docs/BACKUP_SOP.md.
    schedule: "15 3 * * *"
    command: "env SKMEM_BACKUP_RETAIN=1 SKMEM_BACKUP_WEEKLY_RETAIN=0 SKMEM_BACKUP_MONTHLY_RETAIN=0 /bin/bash $HOME/.skcapstone/scripts/skmem-pg-backup.sh"
    log: "$HOME/.skcapstone/logs/skmem-pg-backup.log"

  - name: memory-backup
    # lumina's flat memory, the source of truth: GPG tarball kept 7 daily / 4
    # weekly / 12 monthly, plus a restic snapshot to B2 with the same retention
    # (MEMORY_BACKUP_RESTIC_ENV from the env file). Ran from a hand-written
    # crontab line since 2026-07-12 and was never declared here, which is how
    # it failed on 2026-11-10 (1 GB free) with nothing in skos knowing it
    # existed. Runs after skmem-pg-backup: they compete for disk and IO, and
    # this is the one that must not fail. skmemory docs/BACKUP_SOP.md.
    schedule: "40 3 * * *"
    command: "/bin/bash $HOME/.skcapstone/agents/lumina/scripts/memory-backup.sh"
    log: "$HOME/.skcapstone/agents/lumina/logs/memory-backup-cron.log"

  - name: swarm-replica-watch
    # Prod swarm services below desired / restart loops -> sk-alert.
    # PR smilinTux/skstack01-prod#67, 2026-09-28.
    schedule: "*/10 * * * *"
    command: "/usr/bin/python3 $HOME/.local/lib/swarm-replica-watch/swarm_replica_watch.py --cluster skstack01 --manager skuser@norap1001:1713 --manager skuser@norap1011:1713 --manager skuser@norap1021:1713 --ssh /usr/bin/ssh --alert-cmd $HOME/.skenv/bin/sk-alert --state $HOME/.local/state/swarm-replica-watch/skstack01.json"
    log: "$HOME/.skcapstone/logs/swarm-replica-watch.log"

  - name: skbackup-check
    # NAS backup staleness (sanoid 2h, skbak 26h, restic 36h) + pool health ->
    # sk-alert. PR skstack01-prod feat/skbackup-host-tiers, 2026-09-28.
    schedule: "17 * * * *"
    command: "$HOME/.local/lib/skbackup/skbackup-alert-check.sh norpv1200 $HOME/.skenv/bin/sk-alert"
    log: "$HOME/.skcapstone/logs/skbackup-check.log"

  - name: ollama-health-check
    # Probes .100 (VM 102 ollama norpv1300) :11434/api/tags and pages on down.
    # Coord card .100-hard-hangs, 2026-10-20.
    schedule: "*/5 * * * *"
    command: "$HOME/.local/lib/ollama-vm-watch/ollama-health-check.sh"
    log: "$HOME/.skcapstone/logs/ollama-health-check.log"

  - name: yt-channel-watch
    # Daily Salla / CosmicAgency / Swaruu channel transcripts -> realm wiki
    # raw/youtube + skingest. Source in realmwiki tools/, PR feat/yt-channel-watch;
    # the deployed copy lives in ~/.local/lib/yt-channel-watch.
    schedule: "15 7 * * *"
    command: "$HOME/.local/lib/yt-channel-watch/yt_channel_watch.py --commit"
    log: "$HOME/clawd/logs/yt-channel-watch.log"

  - name: yt-priority
    schedule: "30 1 * * *"
    command: "$HOME/.local/lib/yt-channel-watch/run/priority-nightly.sh"
    log: "$HOME/.skcapstone/logs/yt-priority.log"

  - name: yt-transcripts-backup
    schedule: "50 3 * * *"
    command: "$HOME/.skcapstone/scripts/yt-transcripts-backup.sh"
    log: "$HOME/.skcapstone/logs/yt-transcripts-backup.log"

  - name: pubsub-retention
    # Caps each $HOME/.skcapstone/pubsub/topics/<topic>/ to the newest N messages.
    # Added 2026-11-06 after the topic store was found holding 287,542 message
    # files (1.2 GB on disk, only ~166 MB of content: the rest was block overhead
    # on a quarter-million tiny files). subscriptions.json held one entry,
    # "test.*", with last_read null and message_count 0, so nothing had ever
    # consumed a single message; skgateway.warn alone was 255,461 of them. The
    # one-off cleanup reclaimed 1.17 GB and 281k inodes, and without this job it
    # grows straight back. Runs at 02:15, before the 02:45 GFS state backup, so
    # the daily tarball stops carrying the junk too. The topics are excluded from
    # Syncthing, so this never propagates a delete to the fleet.
    schedule: "15 2 * * *"
    command: "/bin/bash $HOME/clawd/skos/scripts/pubsub-retention.sh"
    log: "$HOME/.skcapstone/logs/pubsub-retention.log"

  - name: yt-transcripts-skhub-sync
    schedule: "20 4 * * *"
    command: "$HOME/.skcapstone/scripts/yt-transcripts-skhub-sync.sh"
    log: "$HOME/.skcapstone/logs/yt-transcripts-skhub-sync.log"
