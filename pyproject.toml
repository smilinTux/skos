[project]
# PyPI distribution name is `skos-sovereign` (the bare name `skos` is on PyPI's
# prohibited-names list). The import package is still `skos` (unchanged), so
# `pip install skos-sovereign` then `import skos`. Mirrors `skchat-sovereign`.
name = "skos-sovereign"
version = "0.3.0"
description = "skos: sovereign agent OS, filesystem & packaging foundation"
requires-python = ">=3.12"
# Fleet-wide licence decision 2026-08-14 (Chef): GPL-3.0-or-later for every sk*
# repo that carried no LICENSE. The full verbatim GPLv3 text is in ./LICENSE.
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
# typer pinned <0.13: newer typer drops click 8.1 compat and breaks the whole CLI
# ("Choice is not subscriptable"). click pinned <8.2: click 8.2+ removes the
# secondary-flag behavior typer 0.12.x relies on ("Secondary flag is not valid
# for non-boolean flag"), so BOTH must be pinned for a from-scratch install to
# yield a working CLI. See docs/gtd-ingest-SOP.md troubleshooting.
# ruamel.yaml preserves registry comments on `skmodels set` / `/model` toggle
# write-back (models/__init__.py); plain-yaml fallback would silently strip them.
dependencies = [
    "typer>=0.12,<0.13",
    "click>=8.1,<8.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "cryptography>=42",
    "ruamel.yaml>=0.18",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
]

[project.scripts]
skos = "skos.cli:app"
sk-status = "skos.status:run"
gtd-mail = "skos.mail:main"
skmodels = "skos.models.cli:main"
skbrain = "skos.brain.ops.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.14", "pytest-cov>=5", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]
# Autopilot / autocode engine. skos.autopilot is a thin re-export shim over
# skharness.autocode (the shared execution engine, extracted per
# docs/superpowers/specs/2026-07-25-autocode-engine-extraction-architecture.md
# Phase B). skharness is a SIBLING library, now PUBLISHED to PyPI, so it stays
# OPTIONAL: a base `pip install skos` (and the whole non-autopilot CLI) resolves
# with core deps only, while `pip install skos[autopilot]` pulls skharness from
# PyPI like any other dependency (no git credential, no direct reference). The
# skharness-dependent tests self-skip at collection when skharness is absent
# (see tests/conftest.py).
autopilot = ["skharness>=0.3.0"]
# Optional READ-ONLY web surface (`skos serve`): serves the live SKWorld module
# manifest + a Grade B status pane the umbrella shell embeds. Kept optional so
# the CLI/scheduler never depend on a web stack.
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit so the built-in capability-pack assets (skos/packs/*/skworld.module.json
# and their fleet templates) ship in the wheel alongside the Python modules.
packages = ["src/skos"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    # Tests that exercise skos's optional integration with the sibling
    # skcapstone package (autopilot orchestrator -> coordination.Board).
    # skcapstone is NOT a declared dependency of skos and is absent in CI, so
    # conftest auto-skips these when it cannot be imported. See tests/conftest.py.
    "needs_skcapstone: requires the optional sibling skcapstone package (auto-skipped when absent)",
]
